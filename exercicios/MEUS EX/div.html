<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com div</title>
    <style>
        div {
            background-color: gray;
            height: 200px;
            width: 200px;
            display: inline-block;
            text-align: center;
            border: 3PX solid black;
        }  
        div:hover
        {background-color: yellow;}
    </style>
</head>
<body>
    <div>01</div>
    <div>02</div>
    <div>03</div>
    <div>04</div>

    <div style="width: 200px; height: 100px; background-color: rgb(39, 160, 201); position: relative; top: 50px; left: 100px;">
        Caixa Relativa
      </div>

      <div style="position: relative; width: 300px; height: 200px; background-color: lightgray;">
        <div style="position: absolute; top: 50px; left: 30px; width: 200px; height: 100px; background-color: coral;">
          Caixa Absoluta
        </div>
      </div>
</body>
</html>
