<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela04</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 600px;
            border-collapse: collapse;
            
        }
        th, td{
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Tabela Completa</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2n">Área</th>
                <th rowspan="2n" colspan="2n">Disciplina</th>
                <th colspan="2n">Nota</th>
                <th rowspan="2n">Média</th>
            </tr>
            <tr>
                <th>Nota1</th>
                <th>Nota2</th>
            </tr>
        </thead>
        <tbody> 
                <tr>
                    <th rowspan="4n">Exatas</th>
                    <td colspan="2n">Matemática</td>
                    <td>0,0</td>
                    <td>0,0</td>
                    <td>0,0</td>
                </tr>
                <tr>
                    <td colspan="2n">Física</td>
                    <td>0,0</td>
                    <td>0,0</td>
                    <td>0,0</td>
                </tr>
                <tr>
                    <td colspan="2n">Química</td>
                    <td>0,0</td>
                    <td>0,0</td>
                    <td>0,0</td>
                </tr>
                <tr>
                    <td colspan="2n">Biologia</td>
                    <td>0,0</td>
                    <td>0,0</td>
                    <td>0,0</td>
                </tr>
                
            
                <tr>
                    <td colspan="5n">Média da Exatas</td>
                    <td>0,0</td>
                </tr>
        
                <tr>
                    <th rowspan="2n">Humanas</th>  
                    <td colspan="2n">História</td>
                    
                    <td colspan="2n">Geográfia</td>
                </tr>
                <tr>
                    <th colspan="4n">Média das Humanas</th>
                    <td>0,0</td>
                    
                </tr>
            
            
        </tbody>
        
    </table>
</body>
</html>
