<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <STyle>

            table{
                border-collapse: collapse;
                width: 500px;
            }

            td{
                border: 1px solid black;
                padding: 5px ;
                text-align: center;
            }
    </STyle>
</head>
<body>
    <h1>Mesclagem de Tabela</h1>
    <table>
        
        <tbody>
            <tr>
                <td>A</td>
                <td colspan="2n">B</td>
                
            </tr>
            <tr>
                <td rowspan="3n">D</td>
                <td>E</td>
                <td rowspan="2n">F</td>
            </tr>
            <tr>
                
                <td>H</td>
                
            </tr>
            <tr>
                
                
                <td colspan="2n">M</td>
            </tr>
        </tbody>
        
    </table>
</body>
</html>
