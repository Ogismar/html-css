<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela04</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 600px;
            
        }
        th, td{
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Tabela Completa</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2n">Área</th>
                <th rowspan="2n">Disciplina</th>
                <th colspan="2n">Nota</th>
                <th rowspan="2n">Média</th>
            </tr>
            <tr>
                <th>Nota1</th>
                <th>Nota2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>Exatas</th>
                <td>Matemática</td>
                <td>Física</td>
                <td>Química</td>
                <td>Biologia</td>
                <td></td>
            </tr>
            <tr>
                <td>Média da Exatas</td>
            </tr>
            <tr>
                <th>Humanas</th>
                <td>História</td>
                <td>Geográfia</td>
                <td></td>
            </tr>
            <tr>
                <th>Média das Humanas</th>
                <td></td>
                <td></td>
            </tr>
            
        </tbody>
        
    </table>
</body>
</html>
