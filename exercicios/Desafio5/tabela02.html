<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela02t</title>
    <STyle>
        table{
            width: 500px;
            border-collapse: collapse;
        }
        td{
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
    </STyle>
</head>
<body>
    <h1>Mesclando Tabela02</h1>
    <table>
        <tr>
            <td colspan="4n">A</td>
            <td rowspan="4n">B</td>
            
        </tr>
        <tr>
            <td rowspan="4n">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
            
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            <td>J</td>
            <td>L</td>
            <td>M</td>
            
        </tr>
        <tr>
            <td colspan="4N">N</td>
           
        </tr>
    </table>
</body>
</html>
