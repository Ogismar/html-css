<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Formulário de Contato</title>
  <style>
    :root{--bg:#f6f7fb;--card:#ffffff;--accent:#4f46e5;--muted:#6b7280}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; background:var(--bg); color:#111;margin:0;padding:32px;}
    .container{max-width:760px;margin:0 auto}
    .card{background:var(--card);border-radius:12px;box-shadow:0 6px 18px rgba(17,24,39,0.06);padding:28px}
    h1{margin:0 0 8px;font-size:20px}
    p.lead{margin:0 0 20px;color:var(--muted)}
    form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{display:block;font-size:13px;margin-bottom:6px}
    input[type="text"],input[type="email"],input[type="tel"],input[type="password"],textarea,select,input[type="date"],input[type="file"]{width:100%;padding:10px;border:1px solid #e6e9ef;border-radius:8px;font-size:14px}
    textarea{min-height:110px;resize:vertical}
    .full{grid-column:1 / -1}
    .actions{display:flex;gap:10px;align-items:center;margin-top:10px}
    button{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:10px;cursor:pointer}
    button.secondary{background:#e6e9ef;color:#111}
    .help{font-size:12px;color:var(--muted);margin-top:6px}
    .error{color:#b91c1c;font-size:13px}
    .flex-row{display:flex;gap:10px;align-items:center}
    .checkbox{display:inline-flex;align-items:center;gap:8px}
    @media (max-width:640px){form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <div class="card" role="region" aria-labelledby="form-title">
      <h1 id="form-title">Formulário de Contato</h1>
      <p class="lead">Preencha os campos abaixo e clique em enviar. Campos com * são obrigatórios.</p>

      <form id="contactForm" novalidate>
        <!-- Nome -->
        <div>
          <label for="nome">Nome completo *</label>
          <input id="nome" name="nome" type="text" required minlength="2" placeholder="Maria da Silva">
          <div class="help" id="nomeHint">Digite o seu nome completo.</div>
        </div>

        <!-- Email -->
        <div>
          <label for="email">Email *</label>
          <input id="email" name="email" type="email" required placeholder="seu@exemplo.com">
        </div>

        <!-- Telefone -->
        <div>
          <label for="telefone">Telefone</label>
          <input id="telefone" name="telefone" type="tel" pattern="\d{10,15}" placeholder="(99) 91234-5678">
          <div class="help">Apenas dígitos (10–15). Opcional.</div>
        </div>

        <!-- Data de Nascimento -->
        <div>
          <label for="dob">Data de nascimento</label>
          <input id="dob" name="dob" type="date">
        </div>

        <!-- Senha e Confirma -->
        <div>
          <label for="senha">Senha *</label>
          <input id="senha" name="senha" type="password" required minlength="8" placeholder="Mínimo 8 caracteres">
        </div>
        <div>
          <label for="confirma">Confirmar senha *</label>
          <input id="confirma" name="confirma" type="password" required minlength="8">
          <div class="help" id="pwHelp">As senhas devem coincidir.</div>
        </div>

        <!-- Gênero -->
        <div>
          <label for="genero">Gênero</label>
          <select id="genero" name="genero">
            <option value="">-- selecione --</option>
            <option value="f">Feminino</option>
            <option value="m">Masculino</option>
            <option value="o">Outro</option>
            <option value="np">Prefiro não dizer</option>
          </select>
        </div>

        <!-- Interesses (checkbox group) -->
        <div class="full">
          <fieldset style="border:none;padding:0;margin:0">
            <legend style="font-weight:600;margin-bottom:8px">Interesses</legend>
            <label class="checkbox"><input type="checkbox" name="int_interesses" value="news"> Notícias</label>
            <label class="checkbox"><input type="checkbox" name="int_interesses" value="offers"> Ofertas</label>
            <label class="checkbox"><input type="checkbox" name="int_interesses" value="events"> Eventos</label>
            <label class="checkbox"><input type="checkbox" name="int_interesses" value="jobs"> Vagas</label>
          </fieldset>
        </div>

        <!-- Mensagem -->
        <div class="full">
          <label for="mensagem">Mensagem *</label>
          <textarea id="mensagem" name="mensagem" required placeholder="Escreva sua mensagem aqui..."></textarea>
        </div>

        <!-- Upload -->
        <div>
          <label for="arquivo">Anexar arquivo (opcional)</label>
          <input id="arquivo" name="arquivo" type="file" accept="image/*,application/pdf">
          <div class="help" id="fileName"></div>
        </div>

        <!-- Termos -->
        <div>
          <label class="checkbox"><input id="termos" name="termos" type="checkbox" required> Aceito os termos e condições *</label>
        </div>

        <!-- Erro geral -->
        <div class="full error" id="formError" aria-live="polite" style="display:none"></div>

        <!-- Ações -->
        <div class="full actions">
          <button type="submit">Enviar</button>
          <button type="button" class="secondary" id="limpar">Limpar</button>
          <div class="help">Os dados não serão enviados de verdade — este é um formulário de exemplo.</div>
        </div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('contactForm');
    const senha = document.getElementById('senha');
    const confirma = document.getElementById('confirma');
    const formError = document.getElementById('formError');
    const arquivo = document.getElementById('arquivo');
    const fileName = document.getElementById('fileName');
    const limpar = document.getElementById('limpar');

    // Mostrar nome do arquivo selecionado
    arquivo.addEventListener('change', () => {
      const f = arquivo.files[0];
      fileName.textContent = f ? `Arquivo selecionado: ${f.name}` : '';
    });

    // Botão limpar
    limpar.addEventListener('click', () => {
      form.reset();
      formError.style.display = 'none';
      fileName.textContent = '';
    });

    // Validação personalizada
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      formError.style.display = 'none';

      // HTML5 validation
      if (!form.checkValidity()){
        formError.textContent = 'Por favor, preencha os campos obrigatórios corretamente.';
        formError.style.display = 'block';
        return;
      }

      // Senhas coincidem?
      if (senha.value !== confirma.value){
        formError.textContent = 'As senhas não coincidem.';
        formError.style.display = 'block';
        return;
      }

      // Telefone (se preenchido) — validar apenas dígitos
      const telefone = document.getElementById('telefone').value.trim();
      if (telefone && !/^\d{10,15}$/.test(telefone)){
        formError.textContent = 'Telefone inválido. Use apenas dígitos (10–15).';
        formError.style.display = 'block';
        return;
      }

      // Se chegou aqui, simulamos envio
      const dados = new FormData(form);
      // Para demo: montar um objeto simples
      const obj = {};
      for (const [k,v] of dados.entries()){
        if (obj[k]){
          if (!Array.isArray(obj[k])) obj[k] = [obj[k]];
          obj[k].push(v);
        } else obj[k] = v;
      }

      // Mostrar resultado no console (substituir por fetch em produção)
      console.log('Dados do formulário (simulação):', obj);
      alert('Formulário válido! (envio simulado — veja console)');
      form.reset();
      fileName.textContent = '';
    });
  </script>
</body>
</html>
